<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VietCrossy</title>
  </head>
  <body>
    <!-- Màn hình chọn nhân vật — hiện trước khi game bắt đầu -->
    <div id="character-select">
      <div class="cs-header">
        <p class="cs-subtitle">CHỌN NHÂN VẬT</p>
        <h1 class="cs-title">VietCrossy</h1>
      </div>
      <!-- Ví xu — hiển thị tổng xu tích lũy từ localStorage -->
      <div class="cs-wallet">
        <span class="cs-wallet-icon">🪙</span>
        <span id="cs-wallet-amount">0</span>
        <span class="cs-wallet-unit"> xu</span>
      </div>
      <!-- Cards được generate động bởi JS (8 nhân vật) -->
      <div class="cs-cards"></div>
      <p class="cs-hint">▶ nhấn để bắt đầu ◀</p>
    </div>

    <!-- Modal xác nhận mua nhân vật — hiện khi click con bị khóa -->
    <div id="buy-modal" class="hidden">
      <div id="buy-dialog">
        <h3 id="buy-modal-name">Nhân vật</h3>
        <div class="buy-modal-info">
          <p>Giá: <strong id="buy-modal-price"></strong> xu</p>
          <p>Ví bạn: <strong id="buy-modal-wallet"></strong> xu</p>
        </div>
        <p id="buy-modal-error" class="hidden">❌ Không đủ xu!</p>
        <div class="buy-modal-actions">
          <button id="buy-modal-confirm" class="buy-btn-confirm">MUA</button>
          <button id="buy-modal-cancel"  class="buy-btn-cancel">HỦY</button>
        </div>
      </div>
    </div>

    <canvas class="game"></canvas>

    <!-- Nút pause — hiện góc trên phải khi đang chơi -->
    <button id="pause-btn" class="pause-btn hidden" aria-label="Tạm dừng">⏸</button>

    <!-- Overlay tạm dừng -->
    <div id="pause-overlay" class="hidden">
      <div id="pause-menu">
        <h2 class="pause-title">TẠM DỪNG</h2>
        <button id="resume-btn" class="pause-action-btn">▶ TIẾP TỤC</button>
        <button id="mute-btn"   class="pause-action-btn pause-action-btn--mute">♪ ÂM THANH: BẬT</button>
        <button id="home-btn"   class="pause-action-btn pause-action-btn--home">⌂ VỀ TRANG CHỦ</button>
      </div>
    </div>

    <div id="controls">
      <div>
        <button id="forward">▲</button>
        <button id="left">◀</button>
        <button id="backward">▼</button>
        <button id="right">▶</button>
      </div>
    </div>
    <div id="score">0</div>
    <div id="result-container">
      <div id="result">
        <h1>Game Over</h1>
        <p>Your score: <span id="final-score"></span></p>
        <button id="retry">Retry</button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
